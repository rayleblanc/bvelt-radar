# bvelt-radar Cloudflare Worker Configuration

name = "bvelt-radar"
main = "src/worker.ts"
compatibility_date = "2024-03-01"
keep_vars = true

[vars]
BVELT_INGEST_URL = "https://bvelt.app/api/radar/observations"
BVELT_TENANT_INGEST_URL = "https://bvelt.app/api/radar/tenant-observations"

# Secrets are configured in the Cloudflare Dashboard (not required in this file
# for preview builds). Runtime auth stays fail-closed when a key is missing:
# - FOUNDER_SERVICE_KEY (required for founder routes)
# - RADAR_SERVICE_KEY (service-to-service)
# - BVELT_TENANT_INGEST_KEY (tenant observation push)
# - GITHUB_ACTIONS_TOKEN / RADAR_SIDECAR_CALLBACK_KEY (sidecar research)

[build]
command = "npm run build"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"

# Founder targeting is intentionally NOT hardcoded in this file.
# Configure these existing variables in Cloudflare Dashboard > Settings > Variables:
# FOUNDING_CITIES, FOUNDING_TRADES, FOUNDING_COUNTRIES, FOUNDING_LANGUAGES, FOUNDING_MIN_SCORE
# keep_vars=true preserves dashboard values across deployments.

[[d1_databases]]
binding = "RADAR_DB"
database_name = "bvelt-radar-db"
database_id = "f1b1f311-c1e4-4318-be0f-aa84c38e0cc1"
migrations_dir = "migrations"

# Cloudflare Queues Producer & Consumer for background job processing
[[queues.producers]]
queue = "bvelt-radar-jobs"
binding = "RADAR_QUEUE"

[[queues.consumers]]
queue = "bvelt-radar-jobs"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
retry_delay = 30
dead_letter_queue = "bvelt-radar-dlq"
max_concurrency = 3

# Free plan: ONE cron expression = ONE trigger slot (not 3).
# Runs at 12:00, 17:00 and 22:00 UTC daily.
[triggers]
crons = ["0 12,17,22 * * *"]

[observability]
enabled = true

# Workers AI: Clef-flash classify + Llama copy fallback (10k Neurons/day free)
[ai]
binding = "AI"

[previews]
