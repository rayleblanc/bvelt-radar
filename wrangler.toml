# bvelt-radar Cloudflare Worker Configuration

name = "bvelt-radar"
main = "src/workerEntry.ts"
compatibility_date = "2024-03-01"
keep_vars = true

[vars]
BVELT_INGEST_URL = "https://bvelt.app/api/radar/observations"
BVELT_TENANT_INGEST_URL = "https://bvelt.app/api/radar/tenant-observations"
GEMINI_MODELS = "gemini-3.8-flash,gemini-3.5-flash-lite"
GEMINI_PAID_TIER_CONFIRMED = "false"
FOUNDER_AUTO_OUTREACH = "false" # Founder prospecting remains manual until explicitly re-enabled after compliance review
GITHUB_ACTIONS_TOKEN = "" # Legacy plaintext binding intentionally blanked; use encrypted GITHUB_ACTIONS_TOKEN_SECRET only

# Secrets are configured in the Cloudflare Dashboard (not required in this file
# for preview builds). Runtime auth stays fail-closed when a key is missing:
# - FOUNDER_SERVICE_KEY (required for founder routes)
# - RADAR_SERVICE_KEY (service-to-service)
# - BVELT_TENANT_INGEST_KEY (tenant observation push)
# - GITHUB_ACTIONS_TOKEN_SECRET / RADAR_SIDECAR_CALLBACK_KEY (legacy optional sidecar only)

# Cloudflare Workers Builds is the release gate; GitHub Actions is not required
# for production Worker build/test/deploy. Keep Node and Python checks in one
# reproducible command so deployment stops if either suite fails.
[build]
command = "npm run build && npm run test:radar && python -m pip install -r sidecar/requirements.txt pytest && python -m pytest sidecar/tests -q"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"

# Founder geography is bundled in src/geoData.ts + src/geoDataAnglosphere.ts and
# rotated automatically using sidecar/config/market-universe.json.
# No FOUNDING_CITIES or FOUNDING_COUNTRIES variables are required.
# Optional operator overrides (e.g. FOUNDING_TRADES / FOUNDING_MIN_SCORE) remain supported.
# keep_vars=true preserves unrelated dashboard values across deployments.

[[d1_databases]]
binding = "RADAR_DB"
database_name = "bvelt-radar-db"
database_id = "f1b1f311-c1e4-4318-be0f-aa84c38e0cc1"
migrations_dir = "migrations"

# Cloudflare Queues Producer & Consumer for background job processing
[[queues.producers]]
queue = "bvelt-radar-jobs"
binding = "RADAR_QUEUE"

[[queues.consumers]]
queue = "bvelt-radar-jobs"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
retry_delay = 30
dead_letter_queue = "bvelt-radar-dlq"
max_concurrency = 3

# Free plan: ONE cron expression = ONE trigger slot (not 3).
# Runs at 12:00, 17:00 and 22:00 UTC daily.
[triggers]
crons = ["0 12,17,22 * * *"]

[observability]
enabled = true
redact_query_string = true

# Workers AI: Clef-flash classify + Llama copy fallback (10k Neurons/day free)
[ai]
binding = "AI"

[previews]
