# bvelt-radar Cloudflare Worker Configuration

name = "bvelt-radar"
main = "src/worker.ts"
compatibility_date = "2024-03-01"
keep_vars = true

[vars]
# Target regions & market parameters (Sun Belt default pool active in code if unset)
FOUNDING_CITIES = "Tampa, FL;Orlando, FL;Austin, TX;Houston, TX;Atlanta, GA;Nashville, TN"
FOUNDING_TRADES = "landscaping;lawn_care;hvac;plumbing;house_cleaning;pool_cleaning;handyman;roofing;pest_control"
FOUNDING_COUNTRIES = "US;MX;ES;CO"
FOUNDING_LANGUAGES = "en;es"
FOUNDING_MIN_SCORE = "50"

# SECRETS (Configure via `npx wrangler secret put <NAME>`):
# - FOUNDER_SERVICE_KEY: Bearer token for authenticating admin & /run endpoints
# - TELEGRAM_BOT_TOKEN: Bot token from @BotFather for sending interactive reports
# - TELEGRAM_CHAT_ID: Founder chat/channel ID where daily digests and buttons are delivered
# - GROQ_API_KEY: (Optional) Groq API key for trade-psychology copywriting (Llama-3.3-70b)
# - GEMINI_FOUNDER_API_KEY: (Optional) Google Gemini Flash fallback for copywriting
# - HUNTER_API_KEY: (Optional) Hunter.io API key for fallback domain email search (strict max 8 credits/day)
# - ABSTRACT_API_KEY: (Optional) Abstract API key for email deliverability check
# - TRUST_STACK_URL: (Optional) Trust stack URL for budget quota checks
# - TRUST_SERVICE_KEY: (Optional) Service token for trust stack

[[d1_databases]]
binding = "RADAR_DB"
database_name = "bvelt-radar-db"
database_id = "f1b1f311-c1e4-4318-be0f-aa84c38e0cc1"
migrations_dir = "migrations"

# Cloudflare Queues Producer & Consumer for background job processing
[[queues.producers]]
queue = "bvelt-radar-jobs"
binding = "RADAR_QUEUE"

[[queues.consumers]]
queue = "bvelt-radar-jobs"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
retry_delay = 60
dead_letter_queue = "bvelt-radar-dlq"
max_concurrency = 1

# Automated daily prospecting scheduled cron (runs once a day at 12:00 PM UTC)
[triggers]
crons = ["0 12 * * *"]

